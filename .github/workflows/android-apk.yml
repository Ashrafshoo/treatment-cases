name: Build Amlakna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project-source.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: amlakna-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract project source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          test -f project-source.zip || {
            echo "ERROR: project-source.zip is missing."
            exit 1
          }

          unzip -tq project-source.zip

          mkdir -p "$RUNNER_TEMP/amlakna-source"
          unzip -q project-source.zip -d "$RUNNER_TEMP/amlakna-source"

          ROOT="$(find "$RUNNER_TEMP/amlakna-source" \
            -type f -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)"

          test -n "$ROOT" || {
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          }

          test -f "$ROOT/android-app/build.gradle.kts" || {
            echo "ERROR: android-app module was not found."
            exit 1
          }

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python regression tests
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check pytest

          mapfile -t TEST_FILES < <(
            find . -type f \
              \( -name 'test_*.py' -o -name '*_test.py' \) \
              -not -path './.git/*' \
              -not -path './.gradle/*' \
              -not -path '*/build/*' \
              | sort
          )

          if [ "${#TEST_FILES[@]}" -gt 0 ]; then
            echo "Found ${#TEST_FILES[@]} Python test files."
            python -m pytest -q "${TEST_FILES[@]}"
          else
            echo "::warning::No Python test files were found in the source ZIP. Python tests were not run."
            echo "### Python tests" >> "$GITHUB_STEP_SUMMARY"
            echo "No Python test files were found. This is not counted as a passing test." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Verify Android build configuration
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android build configuration..."

          grep -R -n \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            'compileSdk' .

          if ! grep -R -q \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            -E 'compileSdk(Version)?[[:space:](=]+36' .; then
            echo "ERROR: compileSdk 36 was not found in the project."
            exit 1
          fi

          if ! grep -R -q \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            '8.10.1' .; then
            echo "ERROR: Android Gradle Plugin 8.10.1 was not found."
            exit 1
          fi

          echo "Android configuration checks passed."

      - name: Run Android tests, lint and build APK
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace --warning-mode all \
            clean \
            :android-app:testDebugUnitTest \
            :android-app:lintDebug \
            :android-app:assembleDebug

      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## أملاكنا – نتيجة البناء"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Android API: 36"
            echo "- Gradle: 8.11.1"
            echo "- Java: 17"
            echo "- Android unit tests, lint and APK build are required."
            echo "- Python tests are reported separately if no test files exist."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amlakna-android-build-${{ github.run_number }}
          path: |
            ${{ steps.source.outputs.project_root }}/android-app/build/outputs/apk/debug/*.apk
            ${{ steps.source.outputs.project_root }}/android-app/build/reports/tests/testDebugUnitTest/**
            ${{ steps.source.outputs.project_root }}/android-app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 21
