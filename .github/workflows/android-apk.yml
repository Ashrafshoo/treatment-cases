
name: Build Amlakna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: amlakna-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract, Validate, Test and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract project ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname '*.zip' -print | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No ZIP archive found in repository root."
            echo "Upload your Android project ZIP to the repository root."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "::error::More than one ZIP archive found. Keep only the intended project ZIP in the repository root."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          echo "Selected archive: $ZIP_FILE"

          unzip -tq "$ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/amlakna-extracted"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Extracted archive contents:"
          find "$EXTRACT_DIR" -maxdepth 3 -type f | head -200

          mapfile -t SETTINGS_FILES < <(
            find "$EXTRACT_DIR" -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -eq 0 ]; then
            echo "::error::No Gradle settings file found in the extracted ZIP."
            exit 1
          fi

          PROJECT_ROOT=""

          for SETTINGS in "${SETTINGS_FILES[@]}"; do
            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -d "$CANDIDATE/android-app" ]; then
              PROJECT_ROOT="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Could not identify the Amlakna Android project root."
            echo "Expected a Gradle project containing the android-app module."
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python tests if available
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check pytest

          mapfile -t TEST_FILES < <(
            find . -type f \
              \( -name 'test_*.py' -o -name '*_test.py' \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' | sort
          )

          if [ "${#TEST_FILES[@]}" -gt 0 ]; then
            echo "Found ${#TEST_FILES[@]} Python test files."
            python -m pytest -q "${TEST_FILES[@]}"
          else
            echo "::warning::No Python tests found. Python tests were not executed."
            echo "This is not counted as a passing test."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Check project configuration
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Gradle project files..."

          test -d android-app || {
            echo "::error::android-app module is missing."
            exit 1
          }

          echo "Gradle settings:"
          find . -maxdepth 2 \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print

          echo "Android configuration references:"
          grep -R -n \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            -E 'compileSdk|com.android.application|com.android.tools.build:gradle' . \
            || true

      - name: Build, test and lint Android
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          gradle --no-daemon --stacktrace --warning-mode all \
            clean \
            :android-app:testDebugUnitTest \
            :android-app:lintDebug \
            :android-app:assembleDebug

      - name: Verify APK output
        id: apk
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="android-app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory was not created."
            exit 1
          fi

          mapfile -t APK_FILES < <(
            find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No APK file was generated."
            exit 1
          fi

          echo "Generated APK files:"
          printf '%s\n' "${APK_FILES[@]}"

          echo "apk_found=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Amlakna-Android-APK-${{ github.run_number }}
          path: ${{ steps.source.outputs.project_root }}/android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Amlakna-Build-Reports-${{ github.run_number }}
          path: |
            ${{ steps.source.outputs.project_root }}/android-app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
