
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Discover and extract Android project from any ZIP
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          : > valid_projects.txt

          mapfile -d '' archives < <(
            find . -type f -iname '*.zip' \
              -not -path './.git/*' -print0
          )

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP archive was found."
            exit 1
          fi

          echo "Found ${#archives[@]} ZIP archive(s)."

          index=0

          for archive in "${archives[@]}"; do
            index=$((index + 1))
            destination="extracted/archive_${index}"

            echo "Extracting: $archive"
            mkdir -p "$destination"
            unzip -q "$archive" -d "$destination"

            while IFS= read -r -d '' settings_file; do
              project_root="$(dirname "$settings_file")"

              if {
                [ -f "$project_root/app/build.gradle.kts" ] ||
                [ -f "$project_root/app/build.gradle" ]
              }; then
                printf '%s\n' "$project_root" >> valid_projects.txt
                echo "Android project candidate: $project_root"
              fi
            done < <(
              find "$destination" -type f \
                \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
                -print0
            )
          done

          count="$(wc -l < valid_projects.txt | tr -d ' ')"

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No valid Android Gradle project was found in the ZIP archives."
            echo "Expected settings.gradle(.kts) and app/build.gradle(.kts)."
            exit 1
          fi

          if [ "$count" -gt 1 ]; then
            echo "ERROR: More than one Android project was found."
            cat valid_projects.txt
            echo "Keep only one valid Android project archive or remove the others."
            exit 1
          fi

          PROJECT_ROOT="$(head -n 1 valid_projects.txt)"

          echo "Selected Android project: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME" /usr/local/lib/android/sdk /opt/android-sdk \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager was not found."
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        env:
          PROJECT_ROOT: ${{ steps.discover.outputs.project_root }}
        run: |
          gradle --no-daemon -p "$PROJECT_ROOT" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amlak-family-android-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
