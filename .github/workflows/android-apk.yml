name: Build Amlakna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project-source.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: amlakna-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract project source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -f project-source.zip || { echo 'project-source.zip is missing from the repository root.'; exit 1; }
          unzip -tq project-source.zip
          mkdir -p "$RUNNER_TEMP/amlakna-source"
          unzip -q project-source.zip -d "$RUNNER_TEMP/amlakna-source"
          ROOT="$(find "$RUNNER_TEMP/amlakna-source" -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$ROOT" || { echo 'settings.gradle.kts was not found inside project-source.zip.'; exit 1; }
          test -f "$ROOT/android-app/build.gradle.kts" || { echo 'Android application module was not found.'; exit 1; }
          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run source and SQLite regression tests
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Run Android unit tests, lint and assemble APK
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all \
            clean \
            :android-app:testDebugUnitTest \
            :android-app:lintDebug \
            :android-app:assembleDebug

      - name: Verify APK exists
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="android-app/build/outputs/apk/debug"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -size +0c -print 2>/dev/null)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No non-empty debug APK found in $APK_DIR"
            find android-app/build/outputs -maxdepth 5 -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi
          printf '%s\n' "${APKS[@]}"
          ls -lh "${APKS[@]}"

      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## أملاكنا – نتيجة البناء'
            echo ''
            echo "- Commit: $GITHUB_SHA"
            echo '- Required gates: Python/SQLite tests, Android JUnit, Android Lint, Debug APK.'
            echo '- If this workflow failed, inspect the first failed step before using any APK.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amlakna-android-build-${{ github.run_number }}
          path: |
            ${{ steps.source.outputs.project_root }}/android-app/build/outputs/apk/debug/*.apk
            ${{ steps.source.outputs.project_root }}/android-app/build/reports/tests/testDebugUnitTest/**
            ${{ steps.source.outputs.project_root }}/android-app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 21
