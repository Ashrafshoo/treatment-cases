name: Family Property Manager Android

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find and extract the single project ZIP
        shell: bash
        run: |
          archive='./family_property_manager_stage12.zip'
          if [ ! -s "$archive" ]; then
            echo "Required project archive is missing: $archive" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/family-property-source"
          unzip -q "$archive" -d "$RUNNER_TEMP/family-property-source"
          PUBSPEC="$(find "$RUNNER_TEMP/family-property-source" -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo 'pubspec.yaml was not found inside the ZIP archive' >&2
            exit 1
          fi
          APP_DIR="$(dirname "$PUBSPEC")"
          if [ ! -f "$APP_DIR/lib/main.dart" ]; then
            echo 'Flutter app directory is missing lib/main.dart' >&2
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Generate Android platform files when missing
        shell: bash
        run: |
          cd "$APP_DIR"
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.familyproperties .
          fi

      - name: Configure Android host for secure storage and biometrics
        shell: bash
        run: |
          cd "$APP_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('AndroidManifest.xml was not generated')
          xml = manifest.read_text(encoding='utf-8')
          for permission in (
              'android.permission.USE_BIOMETRIC',
              'android.permission.USE_FINGERPRINT',
          ):
              if permission not in xml:
                  xml = xml.replace('<application', f'<uses-permission android:name="{permission}" />\n    <application', 1)
          if 'android:allowBackup=' not in xml:
              xml = xml.replace('<application', '<application android:allowBackup="false"', 1)
          manifest.write_text(xml, encoding='utf-8')

          hosts = list(Path('android/app/src/main').rglob('MainActivity.kt'))
          hosts += list(Path('android/app/src/main').rglob('MainActivity.java'))
          if not hosts:
              raise SystemExit('MainActivity source file was not generated')
          for host in hosts:
              code = host.read_text(encoding='utf-8')
              code = code.replace('io.flutter.embedding.android.FlutterActivity',
                                  'io.flutter.embedding.android.FlutterFragmentActivity')
              code = re.sub(r'extends\s+FlutterActivity', 'extends FlutterFragmentActivity', code)
              code = re.sub(r':\s*FlutterActivity\(', ': FlutterFragmentActivity(', code)
              host.write_text(code, encoding='utf-8')

          for gradle in (Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')):
              if gradle.exists():
                  code = gradle.read_text(encoding='utf-8')
                  code = code.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
                  code = code.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
                  gradle.write_text(code, encoding='utf-8')

          rules = Path('android/app/proguard-rules.pro')
          rules.parent.mkdir(parents=True, exist_ok=True)
          existing = rules.read_text(encoding='utf-8') if rules.exists() else ''
          required = '\n-keep class net.sqlcipher.** { *; }\n-keep class net.sqlcipher.database.** { *; }\n'
          if '-keep class net.sqlcipher.**' not in existing:
              rules.write_text(existing + required, encoding='utf-8')
          PY

      - name: Resolve Flutter dependencies
        run: flutter pub get
        working-directory: ${{ env.APP_DIR }}

      - name: Format Dart source
        run: dart format lib test
        working-directory: ${{ env.APP_DIR }}

      - name: Analyze Flutter project
        run: flutter analyze
        working-directory: ${{ env.APP_DIR }}

      - name: Run Flutter tests
        run: flutter test
        working-directory: ${{ env.APP_DIR }}

      - name: Build Android debug APK
        run: flutter build apk --debug
        working-directory: ${{ env.APP_DIR }}

      - name: Verify APK output
        shell: bash
        run: |
          APK="$APP_DIR/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-property-manager-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
