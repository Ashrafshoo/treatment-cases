
name: Build native Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project-source.zip'

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project bundle when present
        shell: bash
        run: |
          if [ -f project-source.zip ]; then
            mkdir -p extracted
            unzip -q project-source.zip -d extracted
            ROOT="$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)"
            test -n "$ROOT" || { echo 'No Android project found in ZIP'; exit 1; }
            echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          else
            echo 'PROJECT_ROOT=.' >> "$GITHUB_ENV"
          fi

      - name: Set up Python for source and schema checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run source and SQLite integrity tests
        run: |
          cd "$PROJECT_ROOT"
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses and install platform tools
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android unit tests, lint, and build APK
        run: |
          cd "$PROJECT_ROOT"
          gradle --no-daemon clean :android-app:testDebugUnitTest :android-app:lintDebug :android-app:assembleDebug

      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: family-property-manager-native-debug
          path: |
            **/android-app/build/outputs/apk/debug/android-app-debug.apk
            **/android-app/build/reports/tests/testDebugUnitTest/**
            **/android-app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 21
