
name: Build Amlakna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: amlakna-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract, Test, Lint and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract the project ZIP
      - name: Locate and extract project ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname '*.zip' -print | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found in repository root."
            echo "Upload the Android project ZIP to the root of the repository."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "::error::Multiple ZIP files found. Keep only the intended project ZIP in the repository root."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          echo "Selected project archive: $ZIP_FILE"

          unzip -tq "$ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/amlakna-extracted"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Archive extracted successfully."

          mapfile -t SETTINGS_FILES < <(
            find "$EXTRACT_DIR" -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -eq 0 ]; then
            echo "::error::No Gradle settings file found in the ZIP."
            exit 1
          fi

          PROJECT_ROOT=""

          for SETTINGS in "${SETTINGS_FILES[@]}"; do
            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -d "$CANDIDATE/android-app" ] && \
              { [ -f "$CANDIDATE/android-app/build.gradle.kts" ] || \
                [ -f "$CANDIDATE/android-app/build.gradle" ]; }; then
              PROJECT_ROOT="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Android project root or android-app module not found."
            echo "The ZIP must contain the complete Amlakna Android project."
            exit 1
          fi

          echo "Detected project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          echo "Project files:"
          find "$PROJECT_ROOT" -maxdepth 2 -type f | head -100

      # 3. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 4. Run Python tests when present
      - name: Run Python regression tests
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check pytest

          mapfile -t TEST_FILES < <(
            find . -type f \
              \( -name 'test_*.py' -o -name '*_test.py' \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' | sort
          )

          if [ "${#TEST_FILES[@]}" -gt 0 ]; then
            echo "Found ${#TEST_FILES[@]} Python test files."
            python -m pytest -q "${TEST_FILES[@]}"
          else
            echo "::warning::No Python test files found. Python tests were not executed."
            echo "No Python tests were counted as passing."
            echo "### Python tests" >> "$GITHUB_STEP_SUMMARY"
            echo "No Python test files were found in the source archive." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # 5. Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 6. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 7. Accept licenses and install Android SDK 36
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "Accepting Android SDK licenses..."

          set +e
          yes | sdkmanager --licenses >/dev/null 2>&1
          LICENSE_STATUS=("${PIPESTATUS[@]}")
          set -e

          if [ "${LICENSE_STATUS[1]}" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed."
            exit 1
          fi

          echo "Installing Android SDK packages..."

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

          echo "Android SDK installation completed."

      # 8. Install Gradle
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      # 9. Inspect Android project configuration
      - name: Inspect Android configuration
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project files..."

          test -d android-app || {
            echo "::error::android-app module is missing."
            exit 1
          }

          echo "Gradle configuration files:"
          find . -maxdepth 3 -type f \
            \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'libs.versions.toml' \) \
            -print

          echo "Android SDK and plugin declarations:"
          grep -R -n \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            -E 'compileSdk|com.android.application|com.android.tools.build:gradle' . \
            || true

      # 10. Run Android unit tests, lint and build
      - name: Run Android tests, lint and build APK
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo "Gradle version:"
          gradle --version

          echo "Starting Android build..."

          gradle --no-daemon --stacktrace --warning-mode all \
            clean \
            :android-app:testDebugUnitTest \
            :android-app:lintDebug \
            :android-app:assembleDebug

      # 11. Verify APK
      - name: Verify generated APK
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="android-app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory does not exist."
            exit 1
          fi

          mapfile -t APK_FILES < <(
            find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No APK file was generated."
            exit 1
          fi

          echo "APK generated successfully:"
          printf '%s\n' "${APK_FILES[@]}"

          echo "APK file details:"
          ls -lh "${APK_FILES[@]}"

          echo "APK verification completed."

      # 12. Upload APK
      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Amlakna-Android-APK-${{ github.run_number }}
          path: ${{ steps.source.outputs.project_root }}/android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 13. Upload diagnostic reports
      - name: Upload diagnostic reports
        if: always() && steps.source.outputs.project_root != ''
        uses: actions/upload-artifact@v4
        with:
          name: Amlakna-Build-Reports-${{ github.run_number }}
          path: |
            ${{ steps.source.outputs.project_root }}/android-app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      # 14. Build summary
      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Amlakna Android Build"
            echo ""
            echo "- Java: 17"
            echo "- Android SDK Platform: 36"
            echo "- Gradle: 8.11.1"
            echo "- Python tests: executed only if test files were found"
            echo "- APK: must be generated and uploaded before the build is considered successful"
          } >> "$GITHUB_STEP_SUMMARY"
